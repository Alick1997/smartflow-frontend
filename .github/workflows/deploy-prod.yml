name: Deploy prod

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate environment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for setting in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKER_NAME CLOUDFLARE_API_TOKEN VITE_API_BASE_URL VITE_CLERK_PUBLISHABLE_KEY; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing prod environment setting: $setting"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy --name "$CLOUDFLARE_WORKER_NAME"
      - name: Record deployed commit
        run: |
          echo "Deployed prod commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
